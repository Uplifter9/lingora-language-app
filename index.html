    document.body.className = `bg-transparent text-slate-800 min-h-screen ${lang === 'ar' ? 'font-ar' : lang === 'he' ? 'font-he' : 'font-en'}`;
  }

  updateStreak() {
    const today = new Date().toDateString();
    const last = this.state.lastPractice;
    if (!last) return;
    const lastDate = new Date(last).toDateString();
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    if (lastDate === today) return;
    if (lastDate === yesterday) this.state.streak++;
    else this.state.streak = 1;
    this.saveState();
  }

  recordPractice() {
    const today = new Date().toDateString();
    if (this.state.lastPractice !== today) {
      const yesterday = new Date(Date.now() - 86400000).toDateString();
      if (!this.state.lastPractice || new Date(this.state.lastPractice).toDateString() !== yesterday) {
        this.state.streak = 1;
      } else {
        this.state.streak++;
      }
      this.state.lastPractice = today;
    }
    this.state.xp += this.sessionStats.xp;
    this.saveState();
  }


  recordDailyActivity() {
    const today = new Date().toISOString().slice(0, 10);
    if (!this.state.dailyActivity) this.state.dailyActivity = {};
    if (!this.state.dailyActivity[today]) this.state.dailyActivity[today] = 0;
    this.state.dailyActivity[today]++;
    this.saveState();
  }

  updateCardProgress(cardId, quality) {
    const pair = this.state.selectedPair;
    if (!this.state.progress[pair]) this.state.progress[pair] = {};
    let p = this.state.progress[pair][cardId] || { ease: 2.5, interval: 0, due: Date.now(), reviews: 0 };
    if (quality >= 3) {
      if (p.reviews === 0) p.interval = 1;
      else if (p.reviews === 1) p.interval = 6;
      else p.interval = Math.round(p.interval * p.ease);
      p.ease = Math.max(1.3, p.ease + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02)));
    } else {
      p.interval = 1;
      p.ease = Math.max(1.3, p.ease - 0.2);
    }
    p.reviews++;
    p.due = Date.now() + p.interval * 86400000;
    this.state.progress[pair][cardId] = p;
    this.saveState();
  }

  getDueCards(pairId) {
    const vocab = this.getFilteredVocab(pairId);
    const progress = this.state.progress[pairId] || {};
    const now = Date.now();
    return vocab.filter(card => !progress[card.id] || progress[card.id].due <= now).slice(0, 15);
  }

  
  getFilteredVocab(pairId) {
    let list = VOCAB[pairId] || [];
    if (this.state.selectedCategory && this.state.selectedCategory !== 'all') {
      list = list.filter(c => c.category === this.state.selectedCategory);
    }
    if (this.state.selectedLevel && this.state.selectedLevel !== 'all') {
      list = list.filter(c => c.level === this.state.selectedLevel);
    }
    return list;
  }

  getNewCards(pairId, limit = 8) {
    const vocab = this.getFilteredVocab(pairId);
    const progress = this.state.progress[pairId] || {};
    return vocab.filter(card => !progress[card.id]).slice(0, limit);
  }

  speak(text, langCode = 'en-US') {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = langCode;
      u.rate = 0.9;
      speechSynthesis.speak(u);
    }
  }

    this.applyUILang();
    const app = document.getElementById('app');
    if (this.currentScreen === 'home') app.innerHTML = this.getTopNav() + this.renderHome();
    else if (this.currentScreen === 'modes') app.innerHTML = this.getTopNav() + this.renderModes();
    else if (this.currentScreen === 'practice') app.innerHTML = this.getTopNav() + this.renderPractice();
    else if (this.currentScreen === 'stats') app.innerHTML = this.getTopNav() + this.renderStats();
    else if (this.currentScreen === 'words') app.innerHTML = this.getTopNav() + this.renderWords();
    else if (this.currentScreen === 'settings') app.innerHTML = this.getTopNav() + this.renderSettings();
    else if (this.currentScreen === 'matching') app.innerHTML = this.getTopNav() + this.renderMatchingGame();
  }

  startMode(mode) {
    this.currentMode = mode;
    let cards = this.getDueCards(this.state.selectedPair);
    if (cards.length < 5) cards = [...cards, ...this.getNewCards(this.state.selectedPair, 10)];
    // sentences mode uses regular cards with examples
    if (cards.length === 0) cards = (VOCAB[this.state.selectedPair] || []).slice(0, 8);
    this.currentCards = cards.slice(0, 12);
    this.cardIndex = 0;
    this.sessionStats = { correct: 0, total: 0, xp: 0 };
    if (mode === 'matching' || mode === 'memory') {
      this.startMatching();
      return;
    }
    this.currentScreen = 'practice';
    this.render();
  }

  startDaily() { this.startMode('flashcards'); }

  renderPractice() {
    if (this.feedback) return this.renderFeedback();
    if (this.cardIndex >= this.currentCards.length) {
      this.recordPractice();
      return this.renderSessionComplete();
    }
    const card = this.currentCards[this.cardIndex];
    const progress = Math.round((this.cardIndex / this.currentCards.length) * 100);
    if (this.currentMode === 'flashcards') return this.renderFlashcard(card, progress);
    if (this.currentMode === 'quiz') return this.renderQuiz(card, progress);
    if (this.currentMode === 'typing') return this.renderTyping(card, progress);
    if (this.currentMode === 'sentences') return this.renderSentences(card, progress);
    if (this.currentMode === 'listening') return this.renderListening(card, progress);
    return this.renderFlashcard(card, progress);
  }

  generateOptions(card) {
    const all = (VOCAB[this.state.selectedPair] || []).map(c => c.back);
    const wrong = all.filter(b => b !== card.back).sort(() => Math.random() - 0.5).slice(0, 3);
    return [...wrong, card.back].sort(() => Math.random() - 0.5);
  }

  checkAnswer(correct, userChoice = null) {
    const card = this.currentCards[this.cardIndex];
    this.sessionStats.total++;
    if (correct) {
      this.sessionStats.correct++;
      this.sessionStats.xp += 10;
      this.updateCardProgress(card.id, 4);
    } else {
      this.updateCardProgress(card.id, 1);
    }
    this.feedback = {
      correct: correct,
      correctAnswer: card.back,
      userAnswer: userChoice,
      front: card.front,
      wasDontKnow: userChoice === null || userChoice === 'dontknow'
    };
    this.render();
  }

  nextAfterFeedback() {
    this.feedback = null;
    this.cardIndex++;
    this.render();

  answer(quality) {
    const card = this.currentCards[this.cardIndex];
    this.sessionStats.total++;
    if (quality >= 3) {

      this.sessionStats.xp += 10;
    }
    this.updateCardProgress(card.id, quality);
    this.recordDailyActivity();
    this.cardIndex++;
    this.render();
  }

    const answer = (input?.value || '').trim();

      this.sessionStats.xp += 15;
      this.updateCardProgress(card.id, 5);

      correct: isCorrect,
      correctAnswer: card.back,
      userAnswer: answer,
      front: card.front,
      example: card.example || ''
    };
    this.render();

        <div class="flex justify-between items-center mb-6">
          <button onclick="lingora.goHome()" class="text-slate-500">✕</button>
          <div class="text-sm text-slate-500">${this.cardIndex + 1} / ${this.currentCards.length}</div>
        </div>
        <button onclick="lingora.speak('${card.back.replace(/'/g, "\\'")}', '${speechLang}')" class="w-28 h-28 mx-auto bg-indigo-500 hover:bg-indigo-600 rounded-full flex items-center justify-center text-5xl mb-6 shadow-lg shadow-indigo-500/30">
          🔊
        </button>
        <p class="text-slate-500 mb-6">${t('listenAndChoose')}</p>
        <div class="space-y-3">
          ${this.generateOptions(card).map(opt => `
            <button onclick="lingora.checkAnswer(${opt === card.back}, '${opt.replace(/'/g, "\\'")}')" class="w-full bg-white hover:bg-slate-700 py-4 rounded-2xl text-lg">
              ${opt}
            </button>
          `).join('')}
        </div>
      </div>
    `;
  }

  startMatching() {
    const cards = this.currentCards.slice(0, 6);
    this.matchingState = {
      cards: cards.flatMap(c => [
        { id: c.id + '-f', text: c.front, emoji: c.emoji, pair: c.id, type: 'front' },
        { id: c.id + '-b', text: c.back, emoji: c.emoji, pair: c.id, type: 'back' }
      ]).sort(() => Math.random() - 0.5),
      selected: null,
      matched: new Set()
    };
    this.currentScreen = 'matching';
    this.render();
  }

  renderMatchingGame() {
    if (!this.matchingState) return this.renderHome();
    const { cards, matched } = this.matchingState;
    return `
      <header class="p-6 pt-4  fade-in flex items-center gap-4">
        <button onclick="lingora.goHome()" class="text-xl">←</button>
        <h1 class="text-xl font-bold">${t('matching')}</h1>
      </header>
      <div class="px-6 grid grid-cols-2 gap-3">
        ${cards.map((c, i) => `
          <button onclick="lingora.selectMatch(${i})" class="game-card bg-white rounded-2xl p-4 min-h-[100px] flex flex-col items-center justify-center ${matched.has(c.pair) ? 'matched' : ''} ${this.matchingState.selected === i ? 'ring-2 ring-indigo-500' : ''}">
            <div class="text-3xl mb-1">${c.emoji || '📝'}</div>
            <div class="text-sm text-center font-medium">${c.text}</div>
          </button>
        `).join('')}
      </div>
    `;
  }

  selectMatch(index) {
    const state = this.matchingState;
    if (state.matched.has(state.cards[index].pair)) return;
    if (state.selected === null) {
      state.selected = index;
    } else if (state.selected === index) {
      state.selected = null;
    } else {
      const a = state.cards[state.selected];
      const b = state.cards[index];
      if (a.pair === b.pair && a.type !== b.type) {
        state.matched.add(a.pair);
        this.sessionStats.correct++;
        this.sessionStats.xp += 20;
        this.updateCardProgress(a.pair, 4);
      }
      state.selected = null;
    }
    if (state.matched.size >= state.cards.length / 2) {
      this.sessionStats.total = state.cards.length / 2;
      this.recordPractice();
      setTimeout(() => {
        this.currentScreen = 'home';
        this.render();
        alert(t('congratulations'));
      }, 500);
    }
    this.render();
  }

  renderSessionComplete() {
    const accuracy = this.sessionStats.total ? Math.round(this.sessionStats.correct / this.sessionStats.total * 100) : 0;
    return `
      <div class="p-6 pt-4 text-center">
        <div class="text-6xl mb-4 float">🎉</div>
        <h2 class="text-3xl font-bold mb-2">${t('congratulations')}</h2>
        <p class="text-slate-500 mb-8">${t('sessionComplete')}</p>
        <div class="grid grid-cols-3 gap-4 mb-8">
          <div class="bg-white rounded-2xl p-4">
            <div class="text-xl font-bold text-emerald-400">${accuracy}%</div>
            <div class="text-xs text-slate-500">${t('accuracy')}</div>
          </div>
          <div class="bg-white rounded-2xl p-4">
            <div class="text-xl font-bold text-amber-400">+${this.sessionStats.xp}</div>
            <div class="text-xs text-slate-500">${t('xp')}</div>
          </div>
          <div class="bg-white rounded-2xl p-4">
            <div class="text-xl font-bold">${this.sessionStats.total}</div>
            <div class="text-xs text-slate-500">${t('cards')}</div>
          </div>
        </div>
        <button onclick="lingora.goHome()" class="w-full bg-gradient-to-r from-indigo-500 to-purple-500 py-4 rounded-2xl font-semibold">${t('back')}</button>
      </div>
    `;
  }


  renderWords() {
    const pair = this.state.selectedPair;
    const vocab = VOCAB[pair] || [];
    const progress = this.state.progress[pair] || {};
    const learned = vocab.filter(c => progress[c.id]).length;

    return `
      <header class="p-6 pt-4  flex items-center gap-4 fade-in">
        <button onclick="lingora.goHome()" class="text-xl">←</button>
        <div>
          <h1 class="text-xl font-bold">${t('allWords')}</h1>
          <p class="text-sm text-slate-500">${learned} / ${vocab.length} ${t('learned')}</p>
        </div>
      </header>
      <div class="px-6  space-y-2 pb-8">
        ${vocab.map(card => {
          const p = progress[card.id];
          const reviews = p ? p.reviews : 0;
          const stars = '⭐'.repeat(Math.min(reviews, 5)) + (reviews > 5 ? ` +${reviews-5}` : '');
          const status = reviews > 0 ? 'text-emerald-600' : 'text-slate-400';
          return `
            <div class="bg-white rounded-2xl p-4 border border-slate-100 flex items-center justify-between">
              <div class="flex-1">
                <div class="font-medium">${card.front}</div>
                <div class="text-sm text-slate-500">${card.back}</div>
                <div class="text-xs text-slate-400 mt-1">${card.category} · ${card.level}</div>
              </div>
              <div class="text-right">
                <div class="${status} text-sm font-medium">${reviews > 0 ? t('learned') : t('new')}</div>
                <div class="text-amber-500 text-sm mt-1">${stars || '—'}</div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  renderStats() {
    const pairProgress = this.state.progress[this.state.selectedPair] || {};
    const learned = Object.keys(pairProgress).length;
    const categories = getCategories();
    // Simple daily activity simulation based on progress
    const activityData = this.state.dailyActivity || {};
    const dates = Object.keys(activityData).sort().slice(-14);
    const activity = dates.map(d => activityData[d] || 0);
    if (activity.length === 0) activity.push(0);
    return `
      <header class="p-6 pt-4 fade-in flex items-center gap-4">
        <button onclick="lingora.goHome()" class="text-xl">←</button>
        <h1 class="text-xl font-bold">${t('progress')}</h1>
      </header>
      <div class="px-6 space-y-4">
        <div class="bg-white rounded-3xl p-6">
          <div class="text-4xl font-bold mb-1">${this.state.xp}</div>
          <div class="text-slate-500">${t('totalXP')}</div>
        </div>
        <div class="bg-white rounded-3xl p-6">
          <div class="text-4xl font-bold mb-1">${this.state.streak} 🔥</div>
          <div class="text-slate-500">${t('streak')}</div>
        </div>
        <div class="bg-white rounded-3xl p-6">
          <div class="text-4xl font-bold mb-1">${learned}</div>
          <div class="text-slate-500">${t('wordsLearned')}</div>
        </div>
        <div class="bg-white rounded-3xl p-6">
          <h2 class="font-semibold mb-3">פעילות יומית</h2>
          <div class="flex gap-1 overflow-x-auto pb-2" style="scroll-snap-type: x mandatory;">
            ${activity.map((v, i) => {
              <div class="flex flex-col items-center flex-shrink-0" style="scroll-snap-align: start; width: 28px;">
                <div class="w-5 bg-indigo-400 rounded-t" style="height: ${v * 8}px;" title="יום ${i+1}: ${v}"></div>
                <div class="text-[9px] text-slate-400 mt-1">${i+1}</div>
              </div>
            `).join('')}
          </div>
          <p class="text-xs text-slate-400 mt-2">גלול ימינה/שמאלה לראות ימים נוספים</p>
        </div>
        ${categories.slice(0, 8).map(cat => {
          const catCards = (VOCAB[this.state.selectedPair] || []).filter(c => c.category === cat);
          const catLearned = catCards.filter(c => pairProgress[c.id]).length;
          return `
            <div class="bg-white rounded-3xl p-5">
              <div class="flex justify-between items-center mb-2">
                <span class="font-medium">${CATEGORY_EMOJI[cat] || '📌'} ${tCat(cat)}</span>
                <span class="text-sm text-slate-500">${catLearned}/${catCards.length}</span>
              </div>
              <div class="h-2 bg-slate-100 rounded-full overflow-hidden">
                <div class="h-full bg-indigo-500 rounded-full" style="width: ${catCards.length ? (catLearned/catCards.length*100) : 0}%"></div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  renderSettings() {
    return `
      <header class="p-6 pt-4  fade-in flex items-center gap-4">
        <button onclick="lingora.goHome()" class="text-xl">←</button>
        <h1 class="text-xl font-bold">${t('settings')}</h1>
      </header>
      <div class="px-6 space-y-6">
        <div>
          <label class="block text-slate-500 text-sm mb-2">${t('uiLanguage')}</label>
          <select onchange="lingora.changeUILang(this.value)" class="w-full bg-white border border-slate-200 rounded-2xl px-4 py-3">
            ${UI_LANGS.map(l => `<option value="${l}" ${this.state.uiLang === l ? 'selected' : ''}>${LANGUAGES[l].flag} ${LANGUAGES[l].native}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="block text-slate-500 text-sm mb-2">${t('learningPair')}</label>
          <select onchange="lingora.changePair(this.value)" class="w-full bg-white border border-slate-200 rounded-2xl px-4 py-3">
            ${PAIRS.map(p => `<option value="${p.id}" ${this.state.selectedPair === p.id ? 'selected' : ''}>${p.name}</option>`).join('')}
          </select>
        </div>
      </div>
    `;
  }

  changeUILang(lang) {
    this.state.uiLang = lang;
    this.saveState();
    this.applyUILang();
    this.render();
  }

  
  changeCategory(cat) {
    this.state.selectedCategory = cat;
    this.saveState();
    this.render();
  }

  changeLevel(lvl) {
    this.state.selectedLevel = lvl;
    this.saveState();
    this.render();
  }

  changePair(pairId) {
    this.state.selectedPair = pairId;
    this.saveState();
    this.render();
  }

  showModes() { this.currentScreen = 'modes'; this.render(); }

  resetStats() {
    if (confirm('לאפס את כל הסטטיסטיקה וההתקדמות?')) {
      this.state.xp = 0;
      this.state.streak = 0;
      this.state.dailyActivity = {};
      this.state.progress = {};
      this.saveState();
      this.render();
    }
  }

  showStats() { this.currentScreen = 'stats'; this.render(); }
  showSettings() { this.currentScreen = 'settings'; this.render(); }
  showWords() { this.currentScreen = 'words'; this.render(); }
  goHome() { this.currentScreen = 'home'; this.render(); }

  registerSW() {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  }
}

const lingora = new LingoraApp();
window.lingora = lingora;
window.app = lingora; // keep for compatibility // for t() helper

</script>
  
</body>
</html>
