<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lingora</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
<nav class="sticky top-0 bg-white border-b px-4 py-3 flex justify-around z-50">
  <button class="flex flex-col items-center text-indigo-600"><span class="text-xl">🏠</span><span class="text-xs">בית</span></button>
  <button class="flex flex-col items-center text-slate-600"><span class="text-xl">📚</span><span class="text-xs">למידה</span></button>
  <button class="flex flex-col items-center text-slate-600"><span class="text-xl">📈</span><span class="text-xs">סטטיסטיקה</span></button>
  <button class="flex flex-col items-center text-slate-600"><span class="text-xl">⚙️</span><span class="text-xs">הגדרות</span></button>
</nav>
<div class="p-6 pt-4">
  <h1 class="text-3xl font-bold bg-gradient-to-r from-indigo-500 to-cyan-500 bg-clip-text text-transparent">Lingora</h1>
  <p class="text-slate-600 mt-1">למידת שפות חכמה</p>
  <div class="mt-6 bg-indigo-50 rounded-2xl p-4">
    <p class="text-sm text-slate-500">שפה נוכחית</p>
    <p class="text-xl font-semibold">he → en</p>
  </div>
  <div class="grid grid-cols-3 gap-2 mt-6">
    <div class="bg-white rounded-xl p-3 text-center border"><div class="text-2xl">🍎</div><div class="text-xs mt-1">אוכל</div></div>
    <div class="bg-white rounded-xl p-3 text-center border"><div class="text-2xl">👨‍👩‍👧‍👦</div><div class="text-xs mt-1">משפחה</div></div>
    <div class="bg-white rounded-xl p-3 text-center border"><div class="text-2xl">💻</div><div class="text-xs mt-1">טכנולוגיה</div></div>
  </div>
  <p class="text-xs text-slate-400 mt-6 text-center">גרסה מעודכנת - הקובץ המלא יועלה בקרוב</p>
</div>
</body>
</html>
